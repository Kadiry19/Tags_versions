name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      target_environment:
        description: Choisis l'environnement
        required: true
        default: env_test
        type: environment

      test_tag:
        description: Choisis les tests à lancer
        required: true
        default: '@account'
        type: choice
        options:
          - '@account'
          - '@signup'
          - '@login'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # env_test est utilisé pour les push et Pull Requests.
    # Au lancement manuel, tu choisis l'environnement.
    environment: ${{ inputs.target_environment || 'env_test' }}

    env:
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          if [ -n "$TEST_TAG" ]; then
            npx playwright test --grep "$TEST_TAG"
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30